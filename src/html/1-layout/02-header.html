<!-- ▸ 02-header.html — Floating header: logo + brand, nav links (sliding hover marker), search, account, cart, ☰. -->
<!-- ═════════ 1. Floating glassy navbar — topmost element, the ONLY blurred layer ═════════ -->
<header id="header" class="sticky top-3 z-40 px-3 pt-3 sm:px-6">
  <div class="mx-auto max-w-7xl">
    <div id="navCapsule" class="flex items-center gap-1.5 rounded-full border border-white/15 bg-[#28622D]/85 px-3.5 py-3 shadow-lg backdrop-blur-md sm:gap-3 sm:px-7 sm:py-3.5">
      <a href="#top" class="flex shrink-0 items-center gap-2 rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white" aria-label="فروشگاه نخل و ماه، صفحه‌ی اصلی">
        <span class="grid h-10 w-10 place-items-center rounded-full bg-white shadow-[0_2px_8px_rgba(17,50,19,0.18)]"><img src="img/logo.svg" alt="" width="976" height="1084" class="h-[30px] w-[30px] object-contain" decoding="async"></span>
        <span class="brand-text font-display text-base font-black text-white sm:text-lg"><span class="hidden lg:inline">فروشگاه </span>نخل و ماه</span>
      </a>

      <!-- Links: one white underline («nav-ink») marks the current page and slides to whichever link the mouse is on (js: 09-header.js) -->
      <nav id="mainNav" class="main-nav mx-auto hidden items-center gap-1 lg:flex" aria-label="منوی اصلی">
        <span class="nav-ink" aria-hidden="true"></span>
        <a href="#top"      class="nav-link" data-nav="home" aria-current="page">خانه</a>
        <a href="#products" class="nav-link" data-nav="products">محصولات</a>
        <a href="#storage"  class="nav-link" data-nav="storage">سردخانه</a>
        <a href="#storage"  class="nav-link" data-service="bulk" data-nav="bulk">خرید عمده</a>
        <a href="#contact"  class="nav-link" data-nav="contact">ارتباط با ما</a>
      </nav>

      <div class="ms-auto flex items-center gap-2 sm:gap-2.5 lg:ms-0">
        <div id="navSearch" class="flex h-10 items-center overflow-hidden rounded-full">
          <button id="searchToggle" class="ease-ui grid h-10 w-10 shrink-0 place-items-center rounded-full text-white/80 hover:bg-white/10 hover:text-white" aria-label="جستجو" aria-expanded="false" aria-controls="search"><svg class="h-[18px] w-[18px]" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <circle cx="11" cy="11" r="8" /> <path d="m21 21-4.3-4.3" /> </svg></button>
          <label for="search" class="sr-only">جستجوی محصول</label>
          <input id="search" type="search" placeholder="جستجو…" class="h-full bg-transparent pl-4 text-sm text-white outline-none placeholder:text-white/50" tabindex="-1" enterkeyhint="search">
        </div>
        <button id="userBtn" class="hdr-pill btn-shine shine-green ease-ui relative inline-flex h-10 w-10 shrink-0 items-center justify-center gap-2 rounded-full bg-white px-0 sm:w-auto sm:px-2.5 text-sm font-bold text-cyprus shadow-[0_6px_16px_rgba(0,0,0,.16)] hover:bg-sand active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white sm:inline-flex lg:px-4" aria-label="ورود / ثبت‌نام">
          <svg class="hp-ic h-[18px] w-[18px]" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <circle cx="12" cy="8" r="5" /> <path d="M20 21a8 8 0 0 0-16 0" /> </svg>
          <span id="userLabel" class="hidden max-w-[10rem] truncate font-display lg:inline">ورود / ثبت‌نام</span>
        </button>
        <button id="cartPill" class="hdr-pill btn-shine shine-green btn-light h-10 shrink-0 px-3 text-sm shadow-[0_6px_16px_rgba(0,0,0,.16)] hover:translate-y-0 hover:shadow-[0_6px_16px_rgba(0,0,0,.16)] sm:px-4" aria-label="سبد خرید" aria-haspopup="dialog" aria-controls="cartDrawer">
          <svg class="hp-ic h-[18px] w-[18px]" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m15 11-1 9" /> <path d="m19 11-4-7" /> <path d="M2 11h20" /> <path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4" /> <path d="M4.5 15.5h15" /> <path d="m5 11 4-7" /> <path d="m9 11 1 9" /> </svg>
          <span id="cartLabel" class="hidden sm:inline">سبد خرید</span>
          <span id="cartCount" class="grid h-5 min-w-5 place-items-center rounded-full bg-[#28622D] px-1.5 font-display text-[11px] font-black text-white">۰</span>
        </button>
        <button id="menuBtn" class="ease-ui grid h-10 w-10 place-items-center rounded-full text-white hover:bg-white/10" aria-label="باز کردن منو" aria-expanded="false" aria-controls="mobileMenu"><svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <line x1="4" x2="20" y1="12" y2="12" /> <line x1="4" x2="20" y1="6" y2="6" /> <line x1="4" x2="20" y1="18" y2="18" /> </svg></button>
      </div>
    </div>

  </div>
</header>
